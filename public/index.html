<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-title" content="MFU Ride">
<title>MFU Ride – Von Umpfenbach nach Frankfurt</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0d0f;overscroll-behavior:none}
body{color:#eee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;max-width:1100px;margin:0 auto;
 padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
#wrap{position:relative;flex:1;min-height:0;border-radius:10px;overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,5,8,.8);overflow:auto;padding:12px;-webkit-user-select:text;user-select:text}
#ov.hide{display:none}
.card{width:min(560px,100%);text-align:center;margin:auto}
.card h1{margin:4px 0;font-size:clamp(22px,6vw,32px);letter-spacing:1px}
.card h1 span{color:#e8b100}
.card p{margin:6px 0;font-size:clamp(13px,3.4vw,15px);color:#ccc}
.logo{height:clamp(80px,22vw,130px);filter:drop-shadow(0 0 8px rgba(255,255,255,.25))}
.items{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0;font-size:clamp(12px,3.2vw,14px)}
.items div{background:#1d1d22;border:1px solid #333;border-radius:6px;padding:5px 9px}
.btn{font:inherit;font-weight:700;font-size:clamp(16px,4.5vw,19px);padding:12px 28px;border:none;border-radius:10px;background:#c0392b;color:#fff;cursor:pointer;margin:6px 4px}
.btn:focus-visible{outline:3px solid #e8b100;outline-offset:2px}
.btn.sec{background:#333}.btn.small{font-size:14px;padding:8px 14px}
table{width:100%;border-collapse:collapse;font-size:clamp(12px,3.3vw,14px);margin-top:6px}
th,td{padding:4px 5px;border-bottom:1px solid #2a2a2a}
th{color:#e8b100;text-align:left}td.r,th.r{text-align:right}
tr.me td{background:#3a2a00;color:#ffd75e;font-weight:700}
input{font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid #555;background:#111;color:#fff;width:min(260px,80%)}
.ctrl{display:grid;gap:6px;flex:none}
.ctrl button{font:inherit;font-weight:700;border-radius:12px;border:1px solid #3a3a42;background:#1e1e23;color:#eee;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none;padding:0}
.ctrl button.on{background:#c0392b;border-color:#c0392b}
.ctrl .dir{font-size:30px}.ctrl .act{font-size:16px}
/* Hochformat: große Lenktasten außen, Bremse/NOS mittig übereinander */
@media (orientation:portrait){
 .ctrl{grid-template-columns:1.25fr 1fr 1.25fr;grid-template-rows:62px 62px;grid-template-areas:"l n r" "l b r"}
}
/* Querformat */
@media (orientation:landscape){
 .ctrl{grid-template-columns:1.3fr 1fr 1fr 1.3fr;grid-template-rows:58px;grid-template-areas:"l b n r"}
}
.ctrl [data-k=l]{grid-area:l}.ctrl [data-k=r]{grid-area:r}.ctrl [data-k=b]{grid-area:b}.ctrl [data-k=n]{grid-area:n}
.help{font-size:12px;color:#888;margin:0 2px;flex:none}
@media (pointer:coarse){.help{display:none}}
#pauseBtn{position:absolute;left:8px;top:84px;width:44px;height:44px;border-radius:22px;border:none;background:rgba(0,0,0,.45);color:#fff;font-size:18px;display:none}
</style></head><body>

function resize(){
 var cw=Math.max(1,wrap.clientWidth),ch=Math.max(1,wrap.clientHeight);PORT=ch>cw;
 if(PORT){W=540;H=Math.round(clamp(540*ch/cw,540,1300))}else{H=540;W=Math.round(clamp(540*cw/ch,540,1300))}
 var dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);

 HORY=Math.round(H*(PORT?0.34:0.40));RIDERY=H-10;
 var half=PORT?0.62*W:Math.min(0.53*W,560);
 CAMH=ROADW*(RIDERY-HORY)*XS/(YS*half);

}

function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function lerp(a,b,p){return a+(b-a)*p}
function easeIn(a,b,p){return a+(b-a)*p*p}
function easeInOut(a,b,p){return a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function lastY(){return segs.length?segs[segs.length-1].p2.world.y:0}
function addSeg(curve,y,zone){var n=segs.length;segs.push({i:n,p1:{world:{y:lastY(),z:n*SEG},camera:{},screen:{}},p2:{world:{y:y,z:(n+1)*SEG},camera:{},screen:{}},curve:curve,sprites:[],items:[],cars:[],zone:zone,dark:Math.floor(n/3)%2,fog:0,clip:H});return segs[n]}
function addRoad(en,ho,le,curve,hill,zone){var sy=lastY(),ey=sy+hill*SEG,t=en+ho+le,n=0,i;
 for(i=0;i<en;i++)addSeg(easeIn(0,curve,i/en),easeInOut(sy,ey,++n/t),zone);
 for(i=0;i<ho;i++)addSeg(curve,easeInOut(sy,ey,++n/t),zone);
 for(i=0;i<le;i++)addSeg(easeInOut(curve,0,i/le),easeInOut(sy,ey,++n/t),zone)}
function townName(i){if(i<ROUTE.length)return ROUTE[i];var n;do{n=pick(RANDOM)}while(n===lastName);lastName=n;return n}
function buildNext(){
 if(gen.phase==='country'){
  var name=townName(gen.idx);gen.name=name;var zone={t:'country',next:name,nextStart:0};var start=segs.length;
  var L=gen.idx===0?45:Math.min(1100,520+gen.idx*70);
  if(gen.idx===0)addRoad(10,25,10,0,0,zone);
  while(segs.length-start<L){var c=pick([0,0,2,-2,3,-3,4,-4,5,-5]),h=pick([0,0,8,-8,15,-15,22,-22]);var a=Math.floor(rnd(20,45));addRoad(a,Math.floor(rnd(20,70)),a,c,h,zone)}
  addRoad(12,12,12,0,-(lastY()/SEG)*0.15,zone);
  zone.nextStart=segs.length;
  for(var i=start;i<segs.length;i++)decorateCountry(segs[i]);
  gen.phase='town';
 }else{
  var zone2={t:'town',name:gen.name},s0=segs.length,TL=Math.floor(rnd(120,170));
  while(segs.length-s0<TL){var c2=pick([0,0,1,-1,2,-2]);addRoad(15,Math.floor(rnd(15,40)),15,c2,0,zone2)}
  for(var j=s0;j<segs.length;j++)decorateTown(segs[j],j-s0,segs.length-s0);
  segs[s0].sprites.push({k:'sign',off:1.38,ww:900,name:gen.name});segs[s0].sprites.push({k:'sign',off:-1.38,ww:900,name:gen.name});segs[s0].enter=gen.name;
  var e=segs[segs.length-2];e.sprites.push({k:'sign',off:1.38,ww:900,name:gen.name,end:true});
  gen.idx++;gen.phase='country';
 }}
function ensure(n){while(segs.length<n)buildNext()}
function placeItem(s){
 if(s.i<40||s.i-gen.lastItem<9)return;var f=Math.max(0.55,1-gen.idx*0.04),r=Math.random();var k=null;
 if(r<0.0055*f)k='fuel';else if(r<0.0055*f+0.0050*f)k='bread';else if(r<0.0055*f+0.0050*f+0.0030)k='beer';
 if(k){s.items.push({k:k,x:pick([-0.5,0,0.5]),z:s.i*SEG+SEG/2});gen.lastItem=s.i}}
function decorateCountry(s){
 var i=s.i;if(i%10===0){s.sprites.push({k:'post',off:-1.12,ww:70});s.sprites.push({k:'post',off:1.12,ww:70})}
 if(Math.random()<0.42){var sd=Math.random()<.5?-1:1;s.sprites.push({k:'tree',off:sd*rnd(1.45,4.5),ww:rnd(900,1600),v:Math.random()<0.4?1:0,c:Math.floor(rnd(0,3))})}
 if(Math.random()<0.12){var sd2=Math.random()<.5?-1:1;s.sprites.push({k:'bush',off:sd2*rnd(1.3,2.2),ww:rnd(400,700)})}
 if(i%90===0&&Math.random()<0.5){s.sprites.push({k:'bale',off:(Math.random()<.5?-1:1)*rnd(2,4),ww:600})}
 placeItem(s)}
var WALLS=['#f2ead8','#efe1bd','#e9d3c4','#f5f1e8','#d9c7a7','#c98f6b','#e4d6a8','#d8dfe3'],ROOFS=['#8e3b2a','#7a2f22','#5e3a2e','#9c4a2c','#4a4a4f'];
function decorateTown(s,k,L){
 if(k>4&&k<L-4){
  if(k%7===0)s.sprites.push(mkHouse(-1));
  if((k+3)%7===0)s.sprites.push(mkHouse(1));
  if(k%16===0)s.sprites.push({k:'lamp',off:1.5,ww:120});
  if((k+8)%16===0)s.sprites.push({k:'lamp',off:-1.5,ww:120});
  if(k===Math.floor(L/2)&&Math.random()<0.6)s.sprites.push({k:'church',off:(Math.random()<.5?-1:1)*3.2,ww:1500});
 }
 placeItem(s)}

var API='/api/scores',GLOBAL=null,lastList=[];

function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},ms)})])}
function fetchHS(){
 if(location.protocol==='file:'||GLOBAL===false){GLOBAL=false;lastList=loadHS();return Promise.resolve(lastList)}
 return withTimeout(fetch(API,{cache:'no-store'}),6000).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
  .then(function(d){if(!d||!Array.isArray(d.scores))throw new Error('format');GLOBAL=true;lastList=d.scores;return lastList})
  .catch(function(){GLOBAL=false;lastList=loadHS();return lastList})}
function submitHS(entry){
 if(!GLOBAL)return Promise.resolve(localSubmit(entry));
 return withTimeout(fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry)}),8000)
  .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
  .then(function(d){lastList=d.scores||[];return d})
  .catch(function(){return null})}

/* ---------- Update ---------- */
function popup(t,c){popups.push({t:t,c:c,a:1.4})}
function update(dt){
 var pz0=pos+PLAYERZ,pSeg=segs[Math.floor(pz0/SEG)],sp=speed/MAXS;
 var st=(keys.r?1:0)-(keys.l?1:0);
 playerX+=st*dt*2.1*Math.min(1,0.3+sp);
 playerX-=dt*2*sp*sp*pSeg.curve*CENTRI;
 if(stamina<25)playerX+=Math.sin(tm*2.7)*dt*0.35*(1-stamina/25);
 playerX=clamp(playerX,-2.2,2.2);
 if(keys.n&&!nosLatch&&nos>0&&boostT<=0&&fuel>0){nos--;boostT=3;popup('LACHGAS!','#5cc8ff');buzz(40)}
 nosLatch=!!keys.n;
 var maxS=MAXS*(boostT>0?1.5:1),off=Math.abs(playerX)>1.02;
 if(fuel<=0)speed+=DEC*1.4*dt;
 else if(keys.b)speed+=BRK*dt;
 else if(speed<maxS)speed+=ACC*(boostT>0?2.4:1)*(1-0.5*speed/maxS)*dt;
 if(speed>maxS)speed=Math.max(maxS,speed+DEC*2*dt);
 if(off&&speed>OFFMAX){speed+=OFFDEC*dt;shake=Math.max(shake,0.08)}
 speed=clamp(speed,0,MAXS*1.5);
 var dz=speed*dt;pos+=dz;
 hillOff+=0.002*pSeg.curve*dz/SEG;skyOff+=0.0008*pSeg.curve*dz/SEG;tread+=dz*0.05;
 fuel=Math.max(0,fuel-dt*(0.35+2.0*sp)*(boostT>0?1.7:1));
 stamina=Math.max(0,stamina-dt*(1.35+(off?3:0)));
 if(boostT>0)boostT-=dt;if(inv>0)inv-=dt;if(shake>0)shake-=dt;if(flash>0)flash-=dt;
 var pz1=pos+PLAYERZ;
 for(var si=Math.floor(pz0/SEG);si<=Math.floor(pz1/SEG);si++){var s=segs[si];
  if(s.enter&&!s.entered&&si*SEG<=pz1){s.entered=true;towns++;curTown=s.enter;score+=500;banner={t:s.enter,a:3}}
  for(var k=s.items.length-1;k>=0;k--){var it=s.items[k];if(it.z>pz0-60&&it.z<=pz1+60&&Math.abs(it.x-playerX)<0.27){s.items.splice(k,1);collect(it.k)}}}
 updateCars(dt,pz0,pz1);
 score+=dz*MPU*0.5;
 popups.forEach(function(p){p.a-=dt});popups=popups.filter(function(p){return p.a>0});
 if(banner){banner.a-=dt;if(banner.a<=0)banner=null}
 if(stamina<=0)return gameOver('Keine Kraft mehr – du hättest mehr Pressack essen sollen!');
 if(fuel<=0&&speed<150)return gameOver('Sprit leer – du stehst am Straßenrand.');
}
function collect(k){score+=50;buzz(15);
 if(k==='bread'){stamina=Math.min(100,stamina+30);popup('+30 Ausdauer 🥪','#ffd27a')}
 else if(k==='fuel'){fuel=Math.min(100,fuel+35);popup('+35 Sprit ⛽','#ff6b6b')}
 else{if(nos<3){nos++;popup('+1 Lachgas 🍺','#5cc8ff')}else{score+=150;popup('+200 Punkte 🍺','#5cc8ff')}}}
var CARCOL=['#c0392b','#2e6fd8','#f1c40f','#ecf0f1','#27ae60','#8e44ad','#e67e22','#2c3e50','#7f8c8d','#111111'];
function updateCars(dt,pz0,pz1){
 var diff=Math.min(10,towns),target=3+Math.floor(diff*0.8);
 spawnT-=dt;
 if(spawnT<=0&&cars.length<target&&speed>MAXS*0.15){spawnT=rnd(0.5,1.5)*Math.max(0.45,1-diff*0.05);
  var onc=Math.random()<0.45,x=onc?-0.5:0.5,z=pz1+(DRAW-15)*SEG;
  var ok=cars.every(function(c){return!(c.x===x&&Math.abs(c.z-z)<2500)});
  if(ok){var town=segs[Math.floor(z/SEG)]&&segs[Math.floor(z/SEG)].zone.t==='town';
   var type=Math.random()<0.17?'truck':Math.random()<0.25?'van':'car';
   var v=onc?-rnd(0.35,0.6)*MAXS:rnd(0.25,0.5)*MAXS;if(town)v*=0.75;
   cars.push({x:x,z:z,v:v,type:type,col:pick(CARCOL),hit:false,prel:z-pz1,ww:type==='truck'?950:type==='van'?820:760})}}
 for(var i=0;i<cars.length;i++){var a=cars[i];if(a.v<=0)continue;for(var j=0;j<cars.length;j++){var b=cars[j];if(i!==j&&b.v>0&&b.x===a.x&&b.z>a.z&&b.z-a.z<900)a.v=Math.min(a.v,b.v)}}
 for(var c=cars.length-1;c>=0;c--){var car=cars[c];car.z+=car.v*dt;var rel=car.z-pz1;
  var crossed=(car.prel>0)!==(rel>0);
  if(!car.hit&&inv<=0&&Math.abs(car.x-playerX)<0.29&&(Math.abs(rel)<160||(crossed&&Math.abs(rel)<1200))){
   car.hit=true;inv=1.6;shake=0.5;flash=0.35;speed*=0.2;stamina=Math.max(0,stamina-30);popup('💥 Unfall! −30 Ausdauer','#ff4d4d');buzz(250)}
  if(car.v>0&&car.prel>0&&rel<=0&&!car.hit){overtakes++;score+=150;popup('Überholt +150','#9cff8a')}
  car.prel=rel;
  if(rel<-SEG*8||rel>(DRAW+5)*SEG)cars.splice(c,1)}}

/* ---------- Zeichnen ---------- */
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function poly(a,b,c,d,e,f,g,h,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.lineTo(g,h);ctx.closePath();ctx.fill()}
function band(p1,p2,l,r,col){poly(p1.x+p1.w*l,p1.y,p1.x+p1.w*r,p1.y,p2.x+p2.w*r,p2.y,p2.x+p2.w*l,p2.y,col)}
function limb(x1,y1,x2,y2,w,c){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function project(p,cx,cy,cz){p.camera.x=-cx;p.camera.y=p.world.y-cy;p.camera.z=p.world.z-cz;p.screen.scale=depth/p.camera.z;p.screen.x=W/2+p.screen.scale*p.camera.x*XS;p.screen.y=HORY-p.screen.scale*p.camera.y*YS;p.screen.w=p.screen.scale*ROADW*XS}

function drawBackground(){
 var k=HORY/216;
 var g=ctx.createLinearGradient(0,0,0,HORY+10);g.addColorStop(0,'#1f5fae');g.addColorStop(0.6,'#76b4e3');g.addColorStop(1,FOGC);ctx.fillStyle=g;ctx.fillRect(0,0,W,HORY+10);
 var sx=((W*0.78-skyOff*W*3)%(W*1.4)+W*1.4)%(W*1.4)-W*0.2,sy=HORY*0.3;
 var sg=ctx.createRadialGradient(sx,sy,5,sx,sy,80);sg.addColorStop(0,'rgba(255,250,220,1)');sg.addColorStop(0.25,'rgba(255,240,180,.8)');sg.addColorStop(1,'rgba(255,240,180,0)');ctx.fillStyle=sg;ctx.fillRect(sx-80,sy-80,160,160);
 ctx.fillStyle='rgba(255,255,255,.85)';clouds.forEach(function(c){var x=((c.x*W-skyOff*W*6)%(W*2)+W*2)%(W*2)-W*0.4;cloud(x,HORY*(0.08+c.y*0.45),c.s)});
 hills(hillOff*W*1.2,'#7e9db3',HORY-58*k,24*k,0.006,0.013,1.7);
 hills(hillOff*W*2.2,'#56805d',HORY-32*k,16*k,0.011,0.023,4.1);
 hills(hillOff*W*3.5,'#3f6e3a',HORY-12*k,9*k,0.02,0.041,0.6);
 ctx.fillStyle='#4f8a2f';ctx.fillRect(0,HORY-1,W,H-HORY+1);
}
function cloud(x,y,s){ctx.beginPath();ctx.ellipse(x,y,46*s,14*s,0,0,7);ctx.ellipse(x-24*s,y+3*s,26*s,11*s,0,0,7);ctx.ellipse(x+20*s,y-7*s,28*s,15*s,0,0,7);ctx.ellipse(x+40*s,y+4*s,22*s,9*s,0,0,7);ctx.fill()}
function hills(off,col,base,amp,f1,f2,ph){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,HORY+2);for(var x=0;x<=W;x+=6){var t=x+off;ctx.lineTo(x,base-amp*(Math.sin(t*f1+ph)+0.5*Math.sin(t*f2+ph*2)+0.3*Math.sin(t*f2*2.3)))}ctx.lineTo(W,HORY+2);ctx.closePath();ctx.fill()}

function drawSeg(s){
 var p1=s.p1.screen,p2=s.p2.screen,town=s.zone.t==='town',d=s.dark;
 ctx.fillStyle=town?(d?'#5f9440':'#699e48'):(d?'#4c862c':'#579434');ctx.fillRect(0,p2.y,W,p1.y-p2.y+1);
 if(town){band(p1,p2,-1.55,1.55,d?'#a7a49b':'#b1aea5');band(p1,p2,-1.07,1.07,'#d6d3c9')}
 else{band(p1,p2,-1.12,1.12,d?'#8d8064':'#968a6e')}

 if(!town){band(p1,p2,-0.97,-0.93,'#eeeeee');band(p1,p2,0.93,0.97,'#eeeeee')}
 if(s.i%4<2)band(p1,p2,-0.018,0.018,'#f2f2f2');
 if(s.fog>0.01){ctx.globalAlpha=s.fog;ctx.fillStyle=FOGC;ctx.fillRect(0,p2.y,W,p1.y-p2.y+1);ctx.globalAlpha=1}
}

 var top=y-ph-h;ctx.fillStyle='#f6c400';rr(x-w/2,top,w,h,w*0.04);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=Math.max(1,w*0.025);rr(x-w/2+w*0.04,top+w*0.04,w-w*0.08,h-w*0.08,w*0.03);ctx.stroke();

function drawHouse(x,y,w,o){var h=w*0.55*o.h*(o.fl/2.4),L=x-w/2,f,v,c;

 for(f=0;f<o.fl;f++)for(c=0;c<4;c++){if(f===0&&c===1)continue;var wx=L+w*(c+0.5)/4-w*0.06,wy=y-(f+1)*fh+fh*0.25;

 ctx.fillStyle='#5a3620';ctx.fillRect(L+w*1.5/4-w*0.06,y-fh*0.7,w*0.12,fh*0.7);ctx.fillStyle='#c9a86a';ctx.fillRect(L+w*1.5/4+w*0.03,y-fh*0.38,w*0.015,w*0.015)}

/* ---------- Eingabe ---------- */
function syncBtns(){document.querySelectorAll('.ctrl button').forEach(function(b){b.classList.toggle('on',!!keys[b.getAttribute('data-k')])})}
function setKey(k,v){keys[k]=v?1:0;syncBtns()}
var map={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowDown:'b',s:'b',S:'b',' ':'b',ArrowUp:'n',n:'n',N:'n',w:'n',W:'n'};
addEventListener('keydown',function(e){if(e.target&&e.target.tagName==='INPUT')return;
 if(e.key==='Enter'){if(state==='menu'||(state==='over'&&!document.getElementById('iName'))){e.preventDefault();start()}return}
 if((e.key==='p'||e.key==='P'||e.key==='Escape')&&(state==='play'||state==='pause')){togglePause();return}
 var k=map[e.key];if(k){e.preventDefault();setKey(k,1)}});
addEventListener('keyup',function(e){var k=map[e.key];if(k){setKey(k,0)}});
function autoPause(){keys.l=keys.r=keys.b=keys.n=0;syncBtns();if(state==='play')togglePause()}
addEventListener('blur',autoPause);
document.addEventListener('visibilitychange',function(){if(document.hidden)autoPause()});
pauseBtn.addEventListener('click',togglePause);
// Touch: mehrere Finger gleichzeitig (z. B. Lenken + NOS)
document.querySelectorAll('.ctrl button').forEach(function(b){var k=b.getAttribute('data-k');
 b.addEventListener('pointerdown',function(e){e.preventDefault();try{b.releasePointerCapture(e.pointerId)}catch(er){}setKey(k,1)});
 ['pointerup','pointerleave','pointercancel','lostpointercapture'].forEach(function(ev){b.addEventListener(ev,function(){setKey(k,0)})});
 b.addEventListener('contextmenu',function(e){e.preventDefault()});
 b.addEventListener('touchstart',function(e){e.preventDefault()},{passive:false})});
document.addEventListener('gesturestart',function(e){e.preventDefault()});
document.addEventListener('dblclick',function(e){e.preventDefault()});
